name: Cypress UI Tests
on: [push]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir o site local
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/site.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "O site não respondeu em 30 segundos."
          cat /tmp/site.log
          exit 1

      - name: Rodar os testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          build: npm run build:css
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4173/

      - name: Gerar Relatório em PDF
        if: always()
        run: |
          if [ ! -f cypress/reports/mochawesome.html ]; then
            echo "Relatório não encontrado. Etapa de PDF ignorada."
            exit 0
          fi
          npm install puppeteer
          DATA=$(date +%Y-%m-%d)
          ARQUIVO="cypress/reports/${DATA}-portfolio-eli.pdf"
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
              const page = await browser.newPage();
              await page.goto('file://' + process.cwd() + '/cypress/reports/mochawesome.html', { waitUntil: 'networkidle2' });
              await page.pdf({ path: '${ARQUIVO}', format: 'A4', printBackground: true });
              await browser.close();
            })();
          "

      # Salva a pasta inteira no cofre (HTML + PDF)
      - name: Salvar Relatório de Testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: cypress/reports